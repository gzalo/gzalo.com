<div class="not-prose mt-10 border-t border-gray-200 pt-5 dark:border-gray-700">
    <button type="button" id="share-page" class="border-2 border-black px-4 py-2 font-mono font-semibold transition-colors hover:bg-black hover:text-white dark:border-white dark:hover:bg-white dark:hover:text-gray-900">
        {{ if eq .Site.Language.Lang "es" }}Compartir{{ else }}Share{{ end }}
    </button>
    <span id="share-status" class="ml-3 text-sm text-gray-600 dark:text-gray-400" role="status" aria-live="polite"></span>
</div>
<script>
(() => {
    const button = document.getElementById('share-page');
    const status = document.getElementById('share-status');
    if (!button || !status) return;
    const copied = '{{ if eq .Site.Language.Lang "es" }}Enlace copiado{{ else }}Link copied{{ end }}';
    const unavailable = '{{ if eq .Site.Language.Lang "es" }}No se pudo compartir el enlace{{ else }}Could not share the link{{ end }}';

    button.addEventListener('click', async () => {
        const shareData = { title: document.title, url: window.location.href };
        if (navigator.share) {
            try {
                await navigator.share(shareData);
                return;
            } catch (error) {
                if (error.name === 'AbortError') return;
            }
        }
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(window.location.href);
            } else {
                const input = document.createElement('textarea');
                input.value = window.location.href;
                input.setAttribute('readonly', '');
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                input.remove();
            }
            status.textContent = copied;
        } catch (error) {
            status.textContent = unavailable;
        }
    });
})();
</script>
